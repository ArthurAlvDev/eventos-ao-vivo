<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos Ao Vivo</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #273549;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --accent-red-glow: rgba(239, 68, 68, 0.35);
      --badge-bg: #1e1b4b;
      --badge-text: #a5b4fc;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 400px;
      min-width: 400px;
      max-width: 400px;
      max-height: 560px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) var(--bg-main);
    }

    body::-webkit-scrollbar {
      width: 6px;
    }

    body::-webkit-scrollbar-track {
      background: var(--bg-main);
    }

    body::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    /* Cabeçalho Fixo */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 0 0 var(--accent-red-glow);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 var(--accent-red-glow);
      }
      70% {
        transform: scale(1.1);
        box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .match-counter {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 2px 7px;
      border-radius: 12px;
    }

    .btn-refresh {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-refresh:hover {
      background-color: var(--bg-surface);
      color: var(--text-main);
    }

    .btn-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Conteúdo Principal */
    main {
      padding: 12px 14px 16px;
    }

    /* Estados: Carregando, Erro e Vazio */
    .status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      text-align: center;
      color: var(--text-muted);
      gap: 12px;
    }

    .status-container p {
      font-size: 13px;
      line-height: 1.4;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Grupos de Categorias */
    .category-group {
      margin-bottom: 18px;
    }

    .category-group:last-child {
      margin-bottom: 4px;
    }

    .category-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .category-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Item / Link da Partida */
    .match-link {
      display: block;
      text-decoration: none;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
    }

    .match-link:hover {
      background-color: var(--bg-surface-hover);
      border-color: #475569;
      transform: translateY(-1px);
    }

    .match-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .badge-league {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: var(--badge-text);
      background-color: var(--badge-bg);
      border: 1px solid rgba(165, 180, 252, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      background: var(--accent-red);
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .match-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .match-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .match-lang {
      font-size: 10px;
      color: #64748b;
    }

    .watch-cta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #f87171;
    }

    .watch-cta svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="live-dot" title="Transmissões ao vivo"></span>
      <h1>Jogos Ao Vivo</h1>
    </div>
    <div class="header-actions">
      <span id="matchCounter" class="match-counter" style="display: none;">0 jogos</span>
      <button id="btnRefresh" class="btn-refresh" title="Atualizar partidas" aria-label="Atualizar partidas">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app">
    <div id="statusView" class="status-container">
      <div class="spinner"></div>
      <p>Buscando partidas ao vivo...</p>
    </div>
    <div id="contentView" style="display: none;"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
