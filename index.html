<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar da Bola - Partidas Reais Ao Vivo & Cronograma</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            pitch: '#0A0D14',
            surface: '#111726',
            card: '#161E31',
            borderLight: 'rgba(255, 255, 255, 0.08)',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0A0D14;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .glass {
      background: rgba(22, 30, 49, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- NAVBAR HEADER -->
  <header class="sticky top-0 z-40 glass border-b border-borderLight shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i data-lucide="play" class="w-5 h-5 text-pitch fill-pitch"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            Radar da Bola
          </h1>
          <p class="text-xs text-slate-400 flex items-center gap-1.5 font-medium">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Partidas Reais com Imagens • Crivo Oficial de Pontuação
          </p>
        </div>
      </div>

      <!-- Relógio e Botão Atualizar -->
      <div class="flex items-center space-x-3">
        <div class="hidden sm:flex items-center space-x-2 bg-pitch/60 border border-borderLight px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span id="hora-atual">--:--:--</span>
        </div>
        <button id="btn-refresh" onclick="carregarPartidas(true)" class="flex items-center space-x-1.5 bg-card hover:bg-slate-700/60 border border-borderLight px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-200 transition shadow-sm active:scale-95">
          <i data-lucide="refresh-cw" id="icon-refresh" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Atualizar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTAINER PRINCIPAL -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- METRICS CARDS -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
      <div class="glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-l-rose-500">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-rose-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
            Ao Vivo Agora
          </p>
          <h3 id="count-aovivo" class="text-2xl sm:text-3xl font-black text-white mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 flex items-center justify-center text-rose-400">
          <i data-lucide="radio" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-l-emerald-500">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-emerald-400">Futebol de Campo</p>
          <h3 id="count-campo" class="text-2xl sm:text-3xl font-black text-white mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400">
          <i data-lucide="shield" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-l-amber-500">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-amber-400">Futsal</p>
          <h3 id="count-futsal" class="text-2xl sm:text-3xl font-black text-white mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-400">
          <i data-lucide="zap" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-l-blue-500">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-blue-400">Ligas / Torneios</p>
          <h3 id="count-ligas" class="text-2xl sm:text-3xl font-black text-white mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-400">
          <i data-lucide="globe-2" class="w-5 h-5"></i>
        </div>
      </div>
    </section>

    <!-- CRONOLOGIA / FILTROS E BUSCA -->
    <section class="glass p-4 sm:p-5 rounded-2xl space-y-3.5">
      <!-- Linha 1: Status, Modo de Visualização, Torneio e Busca -->
      <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <!-- Status Tabs: Todos, Ao Vivo, Agendados -->
          <div class="inline-flex items-center gap-1 p-1 bg-pitch/80 border border-borderLight rounded-xl">
            <button onclick="setStatusFilter('todos')" id="tab-todos" class="tab-status whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-500 text-pitch">
              Todas
            </button>
            <button onclick="setStatusFilter('ao_vivo')" id="tab-ao_vivo" class="tab-status whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
              <span>Ao Vivo</span>
            </button>
            <button onclick="setStatusFilter('agendado')" id="tab-agendado" class="tab-status whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white flex items-center gap-1.5">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
              <span>Agendadas</span>
            </button>
          </div>

          <!-- Seletor de Visualização: Cards vs Linha do Tempo -->
          <div class="inline-flex items-center gap-1 p-1 bg-pitch/80 border border-borderLight rounded-xl">
            <button onclick="setViewMode('cards')" id="view-cards" class="chip-view whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-500 text-pitch flex items-center gap-1.5">
              <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
              <span>Cards</span>
            </button>
            <button onclick="setViewMode('timeline')" id="view-timeline" class="chip-view whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white flex items-center gap-1.5">
              <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i>
              <span>Linha do Tempo</span>
            </button>
          </div>

          <!-- Filtro de Modalidade (Campo x Futsal x Outros Esportes) -->
          <div class="inline-flex flex-wrap items-center gap-1 p-1 bg-pitch/80 border border-borderLight rounded-xl">
            <button onclick="setModalidadeFilter('todas')" id="mod-todas" class="chip-mod whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-700 text-white">
              Todos Esportes
            </button>
            <button onclick="setModalidadeFilter('Futebol de Campo')" id="mod-campo" class="chip-mod whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white">
              ⚽ Campo
            </button>
            <button onclick="setModalidadeFilter('Futsal')" id="mod-futsal" class="chip-mod whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white">
              ⚡ Futsal
            </button>
            <button onclick="setModalidadeFilter('Outros Esportes')" id="mod-outros" class="chip-mod whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white">
              🏅 Outros
            </button>
          </div>
        </div>

        <!-- Seletor Dinâmico de Ligas & Barra de Busca -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 xl:w-auto">
          <div class="relative">
            <select 
              id="select-liga" 
              onchange="setLigaFilter(this.value)" 
              class="w-full sm:w-52 bg-pitch/80 border border-borderLight rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 transition appearance-none cursor-pointer pr-8 font-medium">
              <option value="todas">🌍 Todos os Torneios</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>

          <div class="relative w-full sm:w-64">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input 
              type="text" 
              id="search-input" 
              oninput="filtrarErenderizar()" 
              placeholder="Buscar time, liga ou canal..."
              class="w-full bg-pitch/80 border border-borderLight rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
            >
          </div>
        </div>
      </div>

      <!-- Linha 2: Categorias (Wrap limpo sem barra de rolagem) -->
      <div class="pt-3 border-t border-borderLight/60 flex flex-wrap items-center gap-1.5">
        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mr-1.5 flex items-center gap-1">
          <i data-lucide="filter" class="w-3 h-3"></i> Categoria:
        </span>
        <button onclick="setCategoryFilter('todas')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-emerald-500 bg-emerald-500/20 text-emerald-300">
          Todas
        </button>
        <button onclick="setCategoryFilter('Futsal')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-amber-500/40 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20">
          ⚡ Futsal
        </button>
        <button onclick="setCategoryFilter('Profissional')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700">
          Profissional
        </button>
        <button onclick="setCategoryFilter('Feminino')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700">
          Feminino
        </button>
        <button onclick="setCategoryFilter('Sub-20')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700">
          Sub-20
        </button>
        <button onclick="setCategoryFilter('Sub-17')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700">
          Sub-17
        </button>
        <button onclick="setCategoryFilter('Sub-15')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700">
          Sub-15
        </button>
        <button onclick="setCategoryFilter('Ligas Menores')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700">
          Ligas Menores
        </button>
        <button onclick="setCategoryFilter('Várzea/Amador')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700">
          Várzea / Amador
        </button>
        <button onclick="setCategoryFilter('Esportes Olímpicos')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-violet-500/40 bg-violet-500/10 text-violet-300 hover:bg-violet-500/20">
          🏅 Esportes Olímpicos
        </button>
        <button onclick="setCategoryFilter('NBA')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-orange-500/40 bg-orange-500/10 text-orange-300 hover:bg-orange-500/20">
          🏀 NBA
        </button>
        <button onclick="setCategoryFilter('NFL')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-rose-500/40 bg-rose-500/10 text-rose-300 hover:bg-rose-500/20">
          🏈 NFL
        </button>
        <button onclick="setCategoryFilter('NHL')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-cyan-500/40 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20">
          🏒 NHL
        </button>
        <button onclick="setCategoryFilter('Vôlei')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-sky-500/40 bg-sky-500/10 text-sky-300 hover:bg-sky-500/20">
          🏐 Vôlei
        </button>
        <button onclick="setCategoryFilter('Basquete')" class="chip-cat px-3 py-1 rounded-full text-xs font-semibold transition border border-amber-500/40 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20">
          🏀 Basquete
        </button>
      </div>
    </section>

    <!-- CRONOLOGIA CONTAINER (TIMELINE) -->
    <div id="timeline-container" class="space-y-8">
      <!-- Injetado dinamicamente via JavaScript -->
    </div>

  </main>

  <!-- MODAL DO CARD DETALHADO (ABERTO AO CLICAR NA LINHA DO TEMPO) -->
  <div id="modal-card" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="fecharCardModal(event)">
    <div id="modal-card-content" class="relative w-full max-w-md" onclick="event.stopPropagation()">
      <!-- Injetado via JavaScript com o card completo do jogo -->
    </div>
  </div>

  <!-- MODAL DO PLAYER DE VÍDEO (EMBED) -->
  <div id="modal-player" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-6" onclick="fecharPlayer(event)">
    <div class="relative w-full max-w-4xl bg-surface border border-borderLight rounded-2xl overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-4 py-3 border-b border-borderLight bg-pitch">
        <div class="flex items-center space-x-2 truncate pr-4">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <h4 id="modal-titulo" class="text-sm font-bold text-white truncate">Título do Jogo</h4>
        </div>
        <button onclick="fecharPlayer()" class="w-8 h-8 rounded-lg bg-card hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="relative w-full pb-[56.25%] bg-black">
        <iframe id="iframe-player" class="absolute inset-0 w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div class="p-4 bg-card/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
        <div class="flex items-center space-x-2 text-slate-400 truncate">
          <i data-lucide="tv" class="w-4 h-4 text-emerald-400 shrink-0"></i>
          <span id="modal-canal" class="font-semibold text-slate-200 truncate">Canal</span>
          <span>•</span>
          <span id="modal-liga" class="text-slate-400 truncate">Liga</span>
        </div>
        <a id="modal-link-externo" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center space-x-1.5 px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg transition shrink-0">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          <span>Abrir no YouTube</span>
        </a>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT PRINCIPAL -->
  <script>
    let todasPartidas = [];
    let statusAtivo = 'todos';
    let categoriaAtiva = 'todas';
    let modalidadeAtiva = 'todas';
    let ligaAtiva = 'todas';
    let modoVisualizacao = 'cards';

    function setViewMode(modo) {
      modoVisualizacao = modo;
      const btnCards = document.getElementById('view-cards');
      const btnTimeline = document.getElementById('view-timeline');
      if (modo === 'cards') {
        btnCards.className = 'chip-view whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-500 text-pitch flex items-center gap-1.5';
        btnTimeline.className = 'chip-view whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white flex items-center gap-1.5';
      } else {
        btnTimeline.className = 'chip-view whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-500 text-pitch flex items-center gap-1.5';
        btnCards.className = 'chip-view whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white flex items-center gap-1.5';
      }
      filtrarErenderizar();
    }

    function atualizarRelogio() {
      const agora = new Date();
      document.getElementById('hora-atual').textContent = agora.toLocaleTimeString('pt-BR');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    async function carregarPartidas(comFeedback = false) {
      const btn = document.getElementById('icon-refresh');
      btn.classList.add('animate-spin');

      try {
        const response = await fetch('partidas.json?t=' + Date.now());
        if (!response.ok) throw new Error('Não foi possível carregar partidas.json');
        todasPartidas = await response.json();
        povoarDropdownLigas();
        atualizarContadores();
        filtrarErenderizar();
      } catch (err) {
        console.error('Erro ao ler partidas:', err);
        document.getElementById('timeline-container').innerHTML = `
          <div class="glass p-8 rounded-2xl text-center space-y-3">
            <i data-lucide="alert-circle" class="w-10 h-10 text-rose-500 mx-auto"></i>
            <h3 class="text-base font-bold text-white">Nenhum evento carregado ainda</h3>
            <p class="text-xs text-slate-400 max-w-md mx-auto">
              Execute <code>python search_live_football.py</code> ou <code>executar.bat</code>.
            </p>
          </div>
        `;
        lucide.createIcons();
      } finally {
        setTimeout(() => btn.classList.remove('animate-spin'), 600);
      }
    }

    function povoarDropdownLigas() {
      const select = document.getElementById('select-liga');
      const ligasUnicas = [...new Set(todasPartidas.map(p => p.liga).filter(Boolean))].sort();

      const valorAtual = select.value;
      select.innerHTML = '<option value="todas">🌍 Todos os Torneios</option>';
      
      ligasUnicas.forEach(liga => {
        const opt = document.createElement('option');
        opt.value = liga;
        opt.textContent = liga;
        if (liga === valorAtual) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function atualizarContadores() {
      let aoVivo = 0;
      let campo = 0;
      let futsal = 0;
      let ligas = new Set();

      todasPartidas.forEach(p => {
        if (p.status === 'ao_vivo') aoVivo++;
        if (p.modalidade === 'Futsal' || p.categoria === 'Futsal') {
          futsal++;
        } else if (p.modalidade === 'Futebol de Campo') {
          campo++;
        }
        if (p.liga) ligas.add(p.liga);
      });

      document.getElementById('count-aovivo').textContent = aoVivo;
      document.getElementById('count-campo').textContent = campo;
      document.getElementById('count-futsal').textContent = futsal;
      document.getElementById('count-ligas').textContent = ligas.size;
    }

    function setStatusFilter(status) {
      statusAtivo = status;
      document.querySelectorAll('.tab-status').forEach(btn => {
        btn.className = 'tab-status whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white flex items-center gap-1.5';
      });
      const ativo = document.getElementById('tab-' + status);
      ativo.className = 'tab-status whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-500 text-pitch flex items-center gap-1.5';
      filtrarErenderizar();
    }

    function setModalidadeFilter(mod) {
      modalidadeAtiva = mod;
      document.querySelectorAll('.chip-mod').forEach(btn => {
        btn.className = 'chip-mod whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white';
      });
      const ids = {
        'todas': 'mod-todas',
        'Futebol de Campo': 'mod-campo',
        'Futsal': 'mod-futsal',
        'Outros Esportes': 'mod-outros'
      };
      const ativo = document.getElementById(ids[mod]);
      if (ativo) ativo.className = 'chip-mod whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-500 text-pitch';
      filtrarErenderizar();
    }

    function setCategoryFilter(cat) {
      categoriaAtiva = cat;
      document.querySelectorAll('.chip-cat').forEach(chip => {
        if (chip.textContent.trim().includes(cat) || (cat === 'todas' && chip.textContent.trim() === 'Todas')) {
          chip.className = 'chip-cat shrink-0 px-3 py-1 rounded-full text-xs font-semibold transition border border-emerald-500 bg-emerald-500/20 text-emerald-300';
        } else {
          chip.className = 'chip-cat shrink-0 px-3 py-1 rounded-full text-xs font-semibold transition border border-borderLight bg-card/60 text-slate-300 hover:bg-slate-700';
        }
      });
      filtrarErenderizar();
    }

    function setLigaFilter(liga) {
      ligaAtiva = liga;
      filtrarErenderizar();
    }

    function filtrarErenderizar() {
      const termo = document.getElementById('search-input').value.toLowerCase().trim();

      const filtradas = todasPartidas.filter(p => {
        if (statusAtivo !== 'todos' && p.status !== statusAtivo) return false;
        if (modalidadeAtiva !== 'todas' && p.modalidade !== modalidadeAtiva) return false;
        if (categoriaAtiva !== 'todas' && p.categoria !== categoriaAtiva) return false;
        if (ligaAtiva !== 'todas' && p.liga !== ligaAtiva) return false;

        if (termo) {
          const haystack = `${p.titulo} ${p.liga} ${p.canal || ''} ${p.categoria} ${p.modalidade || ''}`.toLowerCase();
          if (!haystack.includes(termo)) return false;
        }

        return true;
      });

      if (modoVisualizacao === 'timeline') {
        renderizarLinhaDoTempo(filtradas);
      } else {
        renderizarTimeline(filtradas);
      }
    }

    const REGEX_DESTAQUE = /\b(brasileir[aã]o|s[eé]rie\s*[abcd]|copa\s*do\s*brasil|champions\s*league|europa\s*league|conference\s*league|libertadores|sul-?americana|sudamericana)\b/i;

    function ehDestaquePrincipal(p) {
      return REGEX_DESTAQUE.test(`${p.titulo || ''} ${p.liga || ''}`);
    }

    function ordenarComDestaque(lista) {
      return [...lista].sort((a, b) => {
        const dA = ehDestaquePrincipal(a) ? 0 : 1;
        const dB = ehDestaquePrincipal(b) ? 0 : 1;
        if (dA !== dB) return dA - dB;
        return (a.timestamp_inicio || 9999999999) - (b.timestamp_inicio || 9999999999);
      });
    }

    function obterChaveData(p) {
      if (p.status === 'ao_vivo') {
        return { chave: 'AO_VIVO', label: '🔴 Ao Vivo Agora', sub: 'Transmissões em andamento' };
      }
      if (!p.timestamp_inicio) {
        return { chave: 'SEM_DATA', label: '📅 A Confirmar', sub: 'Horário pendente' };
      }
      const d = new Date(p.timestamp_inicio * 1000);
      const hoje = new Date();
      const amanha = new Date();
      amanha.setDate(hoje.getDate() + 1);

      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
      const diaSem = diasSemana[d.getDay()];

      let label = `${dd}/${mm}`;
      let sub = diaSem;
      if (d.toDateString() === hoje.toDateString()) {
        label = `${dd}/${mm} • Hoje`;
      } else if (d.toDateString() === amanha.toDateString()) {
        label = `${dd}/${mm} • Amanhã`;
      }

      const chave = `${d.getFullYear()}-${mm}-${dd}`;
      return { chave, label, sub };
    }

    function renderizarLinhaDoTempo(partidas) {
      const container = document.getElementById('timeline-container');

      if (!partidas.length) {
        container.innerHTML = `
          <div class="glass p-12 rounded-2xl text-center space-y-3">
            <i data-lucide="search-x" class="w-10 h-10 text-slate-500 mx-auto"></i>
            <h3 class="text-base font-bold text-white">Nenhum evento na linha do tempo com esses filtros</h3>
            <p class="text-xs text-slate-400">Ajuste os filtros acima para visualizar os próximos jogos.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const grupos = new Map();
      partidas.forEach(p => {
        const info = obterChaveData(p);
        if (!grupos.has(info.chave)) {
          grupos.set(info.chave, { ...info, itens: [] });
        }
        grupos.get(info.chave).itens.push(p);
      });

      let html = '<div class="relative pl-4 sm:pl-6 space-y-8 before:content-[\'\'] before:absolute before:left-[11px] sm:before:left-[15px] before:top-2 before:bottom-2 before:w-0.5 before:bg-gradient-to-b before:from-emerald-500/60 before:via-slate-700 before:to-transparent">';

      grupos.forEach(grupo => {
        const isLiveGroup = grupo.chave === 'AO_VIVO';
        html += `
          <div class="relative">
            <!-- Marcador da Data na Linha -->
            <div class="flex items-center gap-3 mb-3 -ml-4 sm:-ml-6">
              <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center shrink-0 z-10 border-2 ${isLiveGroup ? 'bg-rose-500/20 border-rose-500 text-rose-400' : 'bg-surface border-emerald-500 text-emerald-400'}">
                <i data-lucide="${isLiveGroup ? 'radio' : 'calendar'}" class="w-3.5 h-3.5"></i>
              </div>
              <div class="flex items-baseline gap-2.5 flex-wrap">
                <h2 class="text-base sm:text-lg font-black tracking-tight ${isLiveGroup ? 'text-rose-400' : 'text-white'}">${grupo.label}</h2>
                <span class="text-xs font-semibold text-slate-400">${grupo.sub}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-borderLight">${grupo.itens.length} evento(s)</span>
              </div>
            </div>

            <!-- Lista de Jogos do Dia -->
            <div class="space-y-2 ml-3 sm:ml-4">
              ${grupo.itens.map(p => {
                const hora = p.status === 'ao_vivo'
                  ? 'AO VIVO'
                  : (p.timestamp_inicio
                      ? new Date(p.timestamp_inicio * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                      : p.horario);
                return `
                  <button
                    onclick="abrirCardModal('${p.id_video}')"
                    class="w-full text-left glass hover:bg-card/90 border border-borderLight hover:border-emerald-500/40 rounded-xl p-3 sm:px-4 transition flex flex-col sm:flex-row sm:items-center justify-between gap-2 group cursor-pointer"
                  >
                    <div class="flex items-center gap-3 min-w-0">
                      <span class="shrink-0 w-16 text-center px-2 py-1 rounded-lg text-xs font-black ${p.status === 'ao_vivo' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30 animate-pulse' : 'bg-pitch text-emerald-400 border border-borderLight'}">
                        ${hora}
                      </span>
                      <div class="min-w-0">
                        <p class="text-sm font-bold text-white group-hover:text-emerald-400 transition truncate">${p.titulo}</p>
                        <div class="flex flex-wrap items-center gap-2 mt-1 text-[11px] text-slate-400">
                          <span class="font-semibold text-slate-300 flex items-center gap-1">
                            <i data-lucide="tv" class="w-3 h-3 text-slate-500"></i>
                            ${p.canal}
                          </span>
                          <span>•</span>
                          <span>🏆 ${p.liga || 'Torneio'}</span>
                        </div>
                      </div>
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0 pl-19 sm:pl-0">
                      ${p.flag_canal === 'VIP' ? `<span class="px-2 py-0.5 rounded text-[10px] font-black bg-amber-500/20 text-amber-300 border border-amber-500/40">⭐ VIP</span>` : ''}
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${getBadgeCategoria(p.categoria)}">${p.categoria}</span>
                      <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-emerald-400 transition hidden sm:inline-block"></i>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
      lucide.createIcons();
    }

    function getBadgeCategoria(categoria) {
      switch (categoria) {
        case 'Futsal': return 'bg-amber-500/15 text-amber-300 border-amber-500/30';
        case 'Vôlei': return 'bg-sky-500/15 text-sky-300 border-sky-500/30';
        case 'NBA': return 'bg-orange-500/15 text-orange-300 border-orange-500/30';
        case 'Basquete': return 'bg-orange-500/15 text-orange-300 border-orange-500/30';
        case 'NFL': return 'bg-rose-500/15 text-rose-300 border-rose-500/30';
        case 'NHL': return 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30';
        case 'Esportes Olímpicos': return 'bg-violet-500/15 text-violet-300 border-violet-500/30';
        case 'Sub-20': return 'bg-purple-500/15 text-purple-300 border-purple-500/30';
        case 'Sub-17': return 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30';
        case 'Sub-15': return 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30';
        case 'Feminino': return 'bg-pink-500/15 text-pink-300 border-pink-500/30';
        case 'Várzea/Amador': return 'bg-amber-500/15 text-amber-300 border-amber-500/30';
        case 'Ligas Menores': return 'bg-sky-500/15 text-sky-300 border-sky-500/30';
        default: return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
      }
    }

    function renderizarTimeline(partidas) {
      const container = document.getElementById('timeline-container');

      if (!partidas.length) {
        container.innerHTML = `
          <div class="glass p-12 rounded-2xl text-center space-y-3">
            <i data-lucide="search-x" class="w-10 h-10 text-slate-500 mx-auto"></i>
            <h3 class="text-base font-bold text-white">Nenhum jogo passou no crivo com esses filtros</h3>
            <p class="text-xs text-slate-400">Tente ajustar seus termos de busca ou mudar os filtros de campeonato.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const aoVivo = ordenarComDestaque(partidas.filter(p => p.status === 'ao_vivo'));
      const agendadas = partidas.filter(p => p.status !== 'ao_vivo');
      const destaquesAgendados = agendadas.filter(p => ehDestaquePrincipal(p));
      const outrosAgendados = agendadas.filter(p => !ehDestaquePrincipal(p));

      let html = '';

      if (aoVivo.length > 0) {
        html += `
          <section class="space-y-4">
            <div class="flex items-center space-x-2.5">
              <span class="flex h-3 w-3 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
              </span>
              <h2 class="text-base font-extrabold uppercase tracking-wider text-rose-400 flex items-center gap-2">
                Ao Vivo Agora <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300">${aoVivo.length}</span>
              </h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${aoVivo.map(p => criarCardPartida(p)).join('')}
            </div>
          </section>
        `;
      } else if (statusAtivo !== 'agendado') {
        html += `
          <div class="glass px-4 py-3 rounded-xl border border-borderLight flex items-center justify-between text-xs text-slate-400">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-slate-600"></span>
              <span>Nenhuma transmissão ao vivo neste exato instante com os filtros atuais.</span>
            </span>
            <span class="text-emerald-400 font-semibold hidden sm:inline">Confira os destaques agendados abaixo ↓</span>
          </div>
        `;
      }

      if (destaquesAgendados.length > 0) {
        html += `
          <section class="space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center space-x-2.5">
                <i data-lucide="flame" class="w-5 h-5 text-amber-400"></i>
                <h2 class="text-base font-extrabold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                  Destaques Principais <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">${destaquesAgendados.length}</span>
                </h2>
              </div>
              <span class="text-[11px] text-slate-400 font-medium">Brasileirão A/B/C/D • Champions • Europa • Conference • Libertadores • Sul-Americana</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${destaquesAgendados.map(p => criarCardPartida(p)).join('')}
            </div>
          </section>
        `;
      }

      if (outrosAgendados.length > 0) {
        html += `
          <section class="space-y-4">
            <div class="flex items-center space-x-2.5">
              <i data-lucide="clock" class="w-4 h-4 text-emerald-400"></i>
              <h2 class="text-base font-extrabold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
                Demais Jogos e Eventos Agendados <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300">${outrosAgendados.length}</span>
              </h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${outrosAgendados.map(p => criarCardPartida(p)).join('')}
            </div>
          </section>
        `;
      }

      container.innerHTML = html;
      lucide.createIcons();
    }

    function criarCardPartida(p) {
      const isAoVivo = p.status === 'ao_vivo';
      const isDestaque = ehDestaquePrincipal(p);
      const badgeCat = getBadgeCategoria(p.categoria);
      const isFutsal = p.modalidade === 'Futsal';

      return `
        <div class="glass rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1 group flex flex-col justify-between shadow-lg ${isDestaque ? 'border-amber-500/40 hover:border-amber-400/70' : 'hover:border-slate-500/50'}">
          <div class="relative w-full aspect-video bg-pitch overflow-hidden">
            <img 
              src="${p.thumbnail || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&auto=format&fit=crop&q=60'}" 
              alt="${p.titulo}" 
              loading="lazy"
              class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-card via-card/20 to-transparent"></div>

            <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between pointer-events-none">
              <!-- Modalidade / Categoria -->
              <div class="flex items-center space-x-1">
                <span class="px-2.5 py-0.5 rounded-md text-[11px] font-extrabold border uppercase tracking-wider backdrop-blur-md ${badgeCat}">
                  ${isFutsal ? '⚡ Futsal' : p.categoria}
                </span>
                ${p.pontuacao ? `
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-pitch/80 text-emerald-400 border border-emerald-500/30 backdrop-blur-md" title="Pontuação do Crivo Oficial">
                    ${p.pontuacao} pts
                  </span>
                ` : ''}
              </div>

              <!-- Horário / Status -->
              ${isAoVivo ? `
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-md text-[11px] font-black uppercase tracking-wider bg-rose-600/90 text-white shadow-lg backdrop-blur-md">
                  <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                  <span>AO VIVO</span>
                </span>
              ` : `
                <span class="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-md text-[11px] font-bold bg-pitch/85 text-emerald-400 border border-emerald-500/30 backdrop-blur-md">
                  <i data-lucide="clock" class="w-3 h-3"></i>
                  <span>${p.horario}</span>
                </span>
              `}
            </div>

            <!-- Liga no pé da imagem -->
            <div class="absolute bottom-2 left-2.5 right-2.5 flex items-center justify-between text-xs text-slate-300 font-semibold truncate">
              <span class="truncate bg-pitch/80 px-2 py-0.5 rounded backdrop-blur-sm border border-borderLight text-[11px]" title="${p.liga}">
                🏆 ${p.liga || 'Torneio Local'}
              </span>
              <span class="text-[11px] text-slate-400 ml-2 uppercase font-mono">
                ${p.idioma || 'PT'}
              </span>
            </div>
          </div>

          <div class="p-4 flex-grow flex flex-col justify-between space-y-3">
            <div>
              <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
                ${isDestaque ? `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-black bg-rose-500/20 text-rose-300 border border-rose-500/40">
                    🔥 DESTAQUE
                  </span>
                ` : ''}
                ${p.flag_canal === 'VIP' ? `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-black bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    ⭐ VIP
                  </span>
                ` : ''}
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">
                  <i data-lucide="shield-check" class="w-3 h-3 text-emerald-400"></i>
                  <span>${p.fonte_confirmacao || 'Confirmado em Sites Gabaritados'}</span>
                </span>
              </div>
              <h3 class="text-sm font-bold text-white leading-snug line-clamp-2 group-hover:text-emerald-400 transition" title="${p.titulo}">
                ${p.titulo}
              </h3>
              <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-1.5 font-medium truncate">
                <i data-lucide="tv" class="w-3.5 h-3.5 text-slate-500 shrink-0"></i>
                <span class="truncate">${p.canal || 'Canal Oficial'}</span>
              </p>
            </div>

            <div class="pt-2 border-t border-borderLight flex items-center gap-2">
              ${p.permite_embed ? `
                <button 
                  onclick="abrirPlayer('${p.id_video}', '${encodeURIComponent(p.titulo)}', '${encodeURIComponent(p.canal || '')}', '${encodeURIComponent(p.liga || '')}')" 
                  class="flex-1 py-1.5 px-3 bg-emerald-500 hover:bg-emerald-400 text-pitch font-extrabold rounded-xl text-xs flex items-center justify-center gap-1.5 transition active:scale-95 shadow-md shadow-emerald-500/10">
                  <i data-lucide="play" class="w-3.5 h-3.5 fill-pitch"></i>
                  <span>Assistir Aqui</span>
                </button>
              ` : `
                <a 
                  href="${p.link_direto}" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  class="flex-1 py-1.5 px-3 bg-card hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 transition border border-borderLight">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>No YouTube</span>
                </a>
              `}

              <a 
                href="${p.link_direto}" 
                target="_blank" 
                rel="noopener noreferrer" 
                title="Abrir no YouTube"
                class="p-2 rounded-xl bg-card hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 border border-borderLight transition">
                <i data-lucide="youtube" class="w-4 h-4"></i>
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function abrirCardModal(idVideo) {
      const partida = todasPartidas.find(p => p.id_video === idVideo);
      if (!partida) return;

      const modal = document.getElementById('modal-card');
      const content = document.getElementById('modal-card-content');
      content.innerHTML = `
        <button onclick="fecharCardModal()" title="Fechar" class="absolute -top-3 -right-3 z-20 w-8 h-8 rounded-full bg-surface border border-borderLight text-slate-300 hover:text-white hover:bg-rose-500 flex items-center justify-center shadow-xl transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        ${criarCardPartida(partida)}
      `;
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function fecharCardModal() {
      const modal = document.getElementById('modal-card');
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function abrirPlayer(idVideo, titulo, canal, liga) {
      fecharCardModal();
      const modal = document.getElementById('modal-player');
      const iframe = document.getElementById('iframe-player');
      
      document.getElementById('modal-titulo').textContent = decodeURIComponent(titulo);
      document.getElementById('modal-canal').textContent = decodeURIComponent(canal);
      document.getElementById('modal-liga').textContent = decodeURIComponent(liga);
      document.getElementById('modal-link-externo').href = `https://www.youtube.com/watch?v=${idVideo}`;
      
      iframe.src = `https://www.youtube.com/embed/${idVideo}?autoplay=1`;
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function fecharPlayer() {
      const modal = document.getElementById('modal-player');
      const iframe = document.getElementById('iframe-player');
      iframe.src = '';
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fecharPlayer();
        fecharCardModal();
      }
    });

    carregarPartidas();
    setInterval(carregarPartidas, 60000);
  </script>
</body>
</html>
