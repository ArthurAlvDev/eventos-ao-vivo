name: CI - Validação de Build da SPA

on:
  # Disparo automático em push desativado para evitar falhas por bloqueio de billing no GitHub Actions.
  workflow_dispatch:

jobs:
  build:
    name: Testar Build de Produção
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar SPA (Vite Build)
        run: npm run build
