name: Buscador de Futebol Ao Vivo

on:
  schedule:
    # Executa todos os dias às 08:00, 14:00 e 19:00 no Horário de Brasília (BRT = UTC-3)
    # 08:00 BRT -> 11:00 UTC
    # 14:00 BRT -> 17:00 UTC
    # 19:00 BRT -> 22:00 UTC
    - cron: '0 11,17,22 * * *'
  workflow_dispatch: # Permite disparo manual ou acionado pelo Bot do Telegram

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-buscador:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        continue-on-error: true

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Executar buscador.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python buscador.py

      - name: Commitar e Salvar partidas.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sincroniza com eventuais commits remotos recentes (ex: blocklist atualizada via Telegram)
          git pull --rebase origin main || true

          if [ -f partidas.json ]; then
            git add partidas.json
            if [ -f public/partidas.json ]; then
              git add public/partidas.json
            fi
            if git diff --staged --quiet; then
              echo "Nenhuma alteração detectada em partidas.json. Nada a commitar."
            else
              git commit -m "chore(data): atualiza partidas.json [skip ci]"
              git push origin main
              echo "partidas.json comitado e atualizado no branch main com sucesso!"
            fi
          else
            echo "::warning ::Arquivo partidas.json não foi encontrado após a execução."
          fi
